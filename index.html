<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- 모바일 웹: 기기 폭에 맞추고 손가락 확대를 막는다(줌 없음 · 팬만). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2b2f3d">
    <title>UnityProject</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #2b2f3d;
        overflow: hidden;
        /* 브라우저 제스처(스크롤·당겨서 새로고침·더블탭 확대)를 끈다 — 드래그가 팬으로만 읽히게. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #unity-stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 세로 9:16 을 지킨 채 화면에 들어가는 가장 큰 크기로 채운다(크기는 아래 스크립트가 잰다). */
      #unity-canvas {
        display: block;
        background: #2b2f3d;
        touch-action: none;
      }

      #unity-loading {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 60%;
        max-width: 420px;
        transform: translate(-50%, -50%);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: #e0e4ef;
        text-align: center;
      }

      #unity-loading-track {
        margin-top: 12px;
        height: 8px;
        border-radius: 4px;
        background: #3d4356;
        overflow: hidden;
      }

      #unity-loading-fill {
        width: 0%;
        height: 100%;
        background: #4c9eef;
      }
    </style>
  </head>
  <body>
    <div id="unity-stage">
      <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
    </div>

    <div id="unity-loading">
      불러오는 중…
      <div id="unity-loading-track"><div id="unity-loading-fill"></div></div>
    </div>

    <script src="Build/WebGL.loader.js?v=fae72ae"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var loadingFill = document.querySelector("#unity-loading-fill");

      // 세로 9:16. 화면이 더 길쭉하면 위아래, 더 넓으면 좌우가 배경색으로 남는다.
      var ASPECT = 1080 / 1920;

      function fitCanvas() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        if (w / h > ASPECT) {
          w = Math.round(h * ASPECT);
        } else {
          h = Math.round(w / ASPECT);
        }

        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }

      fitCanvas();
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", function () {
        setTimeout(fitCanvas, 100);
      });

      // 브라우저가 가로채는 확대·컨텍스트 메뉴를 막는다(탭·드래그만 남긴다).
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb?v=fae72ae",
        frameworkUrl: "Build/WebGL.framework.js.unityweb?v=fae72ae",
        codeUrl: "Build/WebGL.wasm.unityweb?v=fae72ae",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "UnityProject",
        productVersion: "1.0",
      }, function (progress) {
        loadingFill.style.width = (progress * 100) + "%";
      }).then(function () {
        loading.style.display = "none";
        fitCanvas();
      }).catch(function (message) {
        loading.textContent = message;
      });
    </script>
  </body>
</html>
